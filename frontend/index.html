<div role="region" aria-label="Main content">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
<script id="mobile-coming-soon-enforcer">
(function() {
    async function enforceMobileState() {
        try {
            const res = await fetch('/api/admin/mobile_status?t=' + Date.now(), { cache: 'no-store' });
            const data = await res.json();
            const isActive = (data.active === true || data.enabled === true || data.status === 'active');

            // Find all Android / Mobile / APK links and buttons
            const candidates = document.querySelectorAll('a, button');
            candidates.forEach(el => {
                const href = (el.getAttribute('href') || '').toLowerCase();
                const text = (el.innerText || el.textContent || '').toLowerCase();
                const id = (el.id || '').toLowerCase();
                const cl = (el.className || '').toLowerCase();

                // Target strictly Android / APK / Mobile downloads
                const isMobileBtn = href.includes('.apk') || 
                                    text.includes('android') || 
                                    text.includes('mobile download') || 
                                    text.includes('download apk') || 
                                    id.includes('mobile') || 
                                    id.includes('android') || 
                                    cl.includes('mobile-download');

                // Leave Windows / PC strictly untouched
                const isWindows = href.includes('.exe') || href.includes('.zip') || text.includes('windows') || text.includes('pc');
                if (isWindows) return;

                if (isMobileBtn) {
                    if (!isActive) {
                        if (!el.dataset.originalContent) {
                            el.dataset.originalContent = el.innerHTML;
                            el.dataset.originalHref = el.getAttribute('href') || '#';
                        }
                        el.innerHTML = '<span class="inline-flex items-center gap-1.5 font-bold">🔥 Coming Soon</span>';
                        el.removeAttribute('href');
                        el.style.pointerEvents = 'none';
                        el.style.opacity = '0.75';
                        el.style.cursor = 'not-allowed';
                    } else {
                        if (el.dataset.originalContent) {
                            el.innerHTML = el.dataset.originalContent;
                            el.setAttribute('href', el.dataset.originalHref);
                        }
                        el.style.pointerEvents = 'auto';
                        el.style.opacity = '1';
                        el.style.cursor = 'pointer';
                    }
                }
            });
        } catch(err) {
            console.error("Master mobile enforcement error:", err);
        }
    }

    window.addEventListener("DOMContentLoaded", enforceMobileState);
    setInterval(enforceMobileState, 2000);
})();
</script>




</div>




<div id="holo-universe" role="presentation" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;display:flex;align-items:center;justify-content:center;">
  <div class="holo-stage">
    <div class="h-ring h-x"></div>
    <div class="h-ring h-y"></div>
    <div class="h-ring h-z"></div>
    <div class="h-ring h-diag"></div>
    <div class="h-core-sphere"></div>
  </div>
</div>
<style id="holo-style">
  .holo-stage {
    position: relative;
    width: 320px;
    height: 320px;
    transform-style: preserve-3d;
    perspective: 1200px;
    animation: holoWorldRotate 18s linear infinite;
    will-change: transform;
  }
  .h-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(147, 197, 253, 0.35);
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.22), inset 0 0 16px rgba(59, 130, 246, 0.15);
    transform-style: preserve-3d;
    will-change: transform;
  }
  .h-x {
    transform: rotateX(80deg);
    animation: spinX 9s linear infinite;
  }
  .h-y {
    transform: rotateY(80deg);
    animation: spinY 12s linear infinite reverse;
  }
  .h-z {
    transform: rotateZ(45deg) rotateX(45deg);
    animation: spinZ 15s linear infinite;
  }
  .h-diag {
    transform: rotate3d(1, 1, 0, 60deg);
    animation: spinDiag 10s linear infinite reverse;
    border-color: rgba(96, 165, 250, 0.45);
  }
  .h-core-sphere {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(96,165,250,0.5) 45%, rgba(30,58,138,0.15) 80%, transparent 100%);
    box-shadow: 0 0 25px rgba(59,130,246,0.55);
    animation: pulseCore 3s ease-in-out infinite alternate;
  }
  @keyframes holoWorldRotate {
    0% { transform: rotateX(15deg) rotateY(0deg) rotateZ(0deg); }
    50% { transform: rotateX(-15deg) rotateY(180deg) rotateZ(10deg); }
    100% { transform: rotateX(15deg) rotateY(360deg) rotateZ(0deg); }
  }
  @keyframes spinX { 0% { transform: rotateX(80deg) rotateZ(0deg); } 100% { transform: rotateX(80deg) rotateZ(360deg); } }
  @keyframes spinY { 0% { transform: rotateY(80deg) rotateZ(0deg); } 100% { transform: rotateY(80deg) rotateZ(360deg); } }
  @keyframes spinZ { 0% { transform: rotateZ(45deg) rotateX(45deg) rotate(0deg); } 100% { transform: rotateZ(45deg) rotateX(45deg) rotate(360deg); } }
  @keyframes spinDiag { 0% { transform: rotate3d(1, 1, 0, 60deg) rotateZ(0deg); } 100% { transform: rotate3d(1, 1, 0, 60deg) rotateZ(360deg); } }
  @keyframes pulseCore { 0% { transform: scale(0.9); opacity: 0.7; } 100% { transform: scale(1.15); opacity: 1; } }
  
  /* Bold Blue Professional Accents */
  .title-accent-blue {
    color: #ffffff !important;
    font-weight: 800 !important;
    text-shadow: 0 2px 10px rgba(37, 99, 235, 0.45);
  }
  .sub-accent-blue {
    color: #93c5fd !important;
    font-weight: 700 !important;
    letter-spacing: 0.025em;
  }
</style>
