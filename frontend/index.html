      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
        });

</head>
  <body>
<div role="region" aria-label="Main content">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
<script id="mobile-coming-soon-enforcer">
(function() {
    async function enforceMobileState() {
        try {
            const res = await fetch('/api/admin/mobile_status?t=' + Date.now(), { cache: 'no-store' });
            const data = await res.json();
            const isActive = (data.active === true || data.enabled === true || data.status === 'active');

            // Find all Android / Mobile / APK links and buttons
            const candidates = document.querySelectorAll('a, button');
            candidates.forEach(el => {
                const href = (el.getAttribute('href') || '').toLowerCase();
                const text = (el.innerText || el.textContent || '').toLowerCase();
                const id = (el.id || '').toLowerCase();
                const cl = (el.className || '').toLowerCase();

                // Target strictly Android / APK / Mobile downloads
                const isMobileBtn = href.includes('.apk') || 
                                    text.includes('android') || 
                                    text.includes('mobile download') || 
                                    text.includes('download apk') || 
                                    id.includes('mobile') || 
                                    id.includes('android') || 
                                    cl.includes('mobile-download');

                // Leave Windows / PC strictly untouched
                const isWindows = href.includes('.exe') || href.includes('.zip') || text.includes('windows') || text.includes('pc');
                if (isWindows) return;

                if (isMobileBtn) {
                    if (!isActive) {
                        if (!el.dataset.originalContent) {
                            el.dataset.originalContent = el.innerHTML;
                            el.dataset.originalHref = el.getAttribute('href') || '#';
                        }
                        el.innerHTML = '<span class="inline-flex items-center gap-1.5 font-bold">🔥 Coming Soon</span>';
                        el.removeAttribute('href');
                        el.style.pointerEvents = 'none';
                        el.style.opacity = '0.75';
                        el.style.cursor = 'not-allowed';
                    } else {
                        if (el.dataset.originalContent) {
                            el.innerHTML = el.dataset.originalContent;
                            el.setAttribute('href', el.dataset.originalHref);
                        }
                        el.style.pointerEvents = 'auto';
                        el.style.opacity = '1';
                        el.style.cursor = 'pointer';
                    }
                }
            });
        } catch(err) {
            console.error("Master mobile enforcement error:", err);
        }
    }

    window.addEventListener("DOMContentLoaded", enforceMobileState);
    setInterval(enforceMobileState, 2000);
})();
</script>




</div>

<div id="holo-universe" role="presentation" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;display:flex;align-items:center;justify-content:center;">
  <div style="position:relative;width:340px;height:340px;perspective:1000px;transform-style:preserve-3d;">
    <div class="h-ring r1"></div>
    <div class="h-ring r2"></div>
    <div class="h-ring r3"></div>
    <div class="h-core"></div>
  </div>
</div>
<style id="holo-style">
  .h-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(228, 228, 231, 0.28);
    box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.08), 0 0 15px rgba(255, 255, 255, 0.08);
    will-change: transform;
  }
  .r1 { animation: rotHolo1 12s linear infinite; }
  .r2 { animation: rotHolo2 16s linear infinite reverse; }
  .r3 { animation: rotHolo3 20s linear infinite; }
  .h-core {
    position: absolute;
    top: 50%; left: 50%;
    width: 70px; height: 70px;
    margin: -35px 0 0 -35px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(212,212,216,0.15) 70%, transparent 100%);
    box-shadow: 0 0 30px rgba(255,255,255,0.25);
    animation: pulseCore 3s ease-in-out infinite alternate;
    will-change: transform, opacity;
  }
  @keyframes rotHolo1 { 0% { transform: rotateX(65deg) rotateY(20deg) rotateZ(0deg); } 100% { transform: rotateX(65deg) rotateY(20deg) rotateZ(360deg); } }
  @keyframes rotHolo2 { 0% { transform: rotateX(25deg) rotateY(70deg) rotateZ(0deg); } 100% { transform: rotateX(25deg) rotateY(70deg) rotateZ(360deg); } }
  @keyframes rotHolo3 { 0% { transform: rotateX(80deg) rotateY(-40deg) rotateZ(0deg); } 100% { transform: rotateX(80deg) rotateY(-40deg) rotateZ(360deg); } }
  @keyframes pulseCore { 0% { transform: scale(0.85); opacity: 0.6; } 100% { transform: scale(1.15); opacity: 1; } }
</style>

</body>
</html>
