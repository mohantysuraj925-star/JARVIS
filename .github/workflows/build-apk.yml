name: Build Android companion APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - downloads/app-debug.apk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: ./android_companion
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace -x lint -x test

      - name: Stage APK for the web server
        run: |
          mkdir -p downloads
          cp android_companion/app/build/outputs/apk/debug/app-debug.apk downloads/app-debug.apk
          test -s downloads/app-debug.apk

      - name: Publish APK to main for deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/app-debug.apk
          if git diff --cached --quiet; then
            echo "The published APK is already up to date."
          else
            git commit -m "ci: publish Android companion APK [skip ci]"
            git push origin HEAD:main
          fi
