<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS by Suraj</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #07090f;
      --card:   rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --adim:   rgba(99,102,241,0.15);
      --text:   #dde3ed;
      --muted:  #5e6a7e;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 340px;
      padding: 44px 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 10px;
      margin-bottom: 6px;
    }
    .logo em { color: var(--accent); font-style: normal; }
    .brand { font-size: 11px; font-weight: 500; letter-spacing: 1px; color: var(--muted); }
    .sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 18px 14px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 10px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: rgba(94,106,126,0.5);
      letter-spacing: 6px;
      font-size: 20px;
    }
    .key-input:focus {
      border-color: var(--accent);
      background: var(--adim);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .err {
      font-size: 12px;
      color: #f87171;
      min-height: 18px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
      text-align: left;
    }
    .voice-note code {
      background: rgba(255,255,255,0.07);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
    }
    #reconnecting {
      display: none;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }
  </style>

    <!-- PWA Config -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
        });
      }
    </script>

</head>
<body>
<div role="region" aria-label="Main content">
  <div class="card" id="card">
    <div class="logo"><em>J</em>ARVIS <span class="brand">by Suraj</span></div>
    <div class="sub">Remote Access</div>
    <p id="reconnecting">Reconnecting…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the JARVIS desktop app to get a QR code or session key.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">CONNECT</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--text)">Voice commands:</strong> open
      <code>chrome://flags</code> on your phone, search
      <code>Insecure origins treated as secure</code>, add your JARVIS URL, tap Relaunch.
    </p>
  </div>

  <script>
    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      // Device token rejected (server restarted) — clear it and show normal form
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('jarvis_token', data.token);
        if (data.device_token) localStorage.setItem('jarvis_device_token', data.device_token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>

<script id="mobile-coming-soon-enforcer">
(function() {
    async function enforceMobileState() {
        try {
            const res = await fetch('/api/admin/mobile_status?t=' + Date.now(), { cache: 'no-store' });
            const data = await res.json();
            const isActive = (data.active === true || data.enabled === true || data.status === 'active');

            // Find all Android / Mobile / APK links and buttons
            const candidates = document.querySelectorAll('a, button');
            candidates.forEach(el => {
                const href = (el.getAttribute('href') || '').toLowerCase();
                const text = (el.innerText || el.textContent || '').toLowerCase();
                const id = (el.id || '').toLowerCase();
                const cl = (el.className || '').toLowerCase();

                // Target strictly Android / APK / Mobile downloads
                const isMobileBtn = href.includes('.apk') || 
                                    text.includes('android') || 
                                    text.includes('mobile download') || 
                                    text.includes('download apk') || 
                                    id.includes('mobile') || 
                                    id.includes('android') || 
                                    cl.includes('mobile-download');

                // Leave Windows / PC strictly untouched
                const isWindows = href.includes('.exe') || href.includes('.zip') || text.includes('windows') || text.includes('pc');
                if (isWindows) return;

                if (isMobileBtn) {
                    if (!isActive) {
                        if (!el.dataset.originalContent) {
                            el.dataset.originalContent = el.innerHTML;
                            el.dataset.originalHref = el.getAttribute('href') || '#';
                        }
                        el.innerHTML = '<span class="inline-flex items-center gap-1.5 font-bold">🔥 Coming Soon</span>';
                        el.removeAttribute('href');
                        el.style.pointerEvents = 'none';
                        el.style.opacity = '0.75';
                        el.style.cursor = 'not-allowed';
                    } else {
                        if (el.dataset.originalContent) {
                            el.innerHTML = el.dataset.originalContent;
                            el.setAttribute('href', el.dataset.originalHref);
                        }
                        el.style.pointerEvents = 'auto';
                        el.style.opacity = '1';
                        el.style.cursor = 'pointer';
                    }
                }
            });
        } catch(err) {
            console.error("Master mobile enforcement error:", err);
        }
    }

    window.addEventListener("DOMContentLoaded", enforceMobileState);
    setInterval(enforceMobileState, 2000);
})();
</script>




</div>




<div id="holo-universe" role="presentation" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;display:flex;align-items:center;justify-content:center;">
  <div class="holo-stage">
    <div class="h-ring h-x"></div>
    <div class="h-ring h-y"></div>
    <div class="h-ring h-z"></div>
    <div class="h-ring h-diag"></div>
    <div class="h-core-sphere"></div>
  </div>
</div>
<style id="holo-style">
  .holo-stage {
    position: relative;
    width: 320px;
    height: 320px;
    transform-style: preserve-3d;
    perspective: 1200px;
    animation: holoWorldRotate 18s linear infinite;
    will-change: transform;
  }
  .h-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(147, 197, 253, 0.35);
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.22), inset 0 0 16px rgba(59, 130, 246, 0.15);
    transform-style: preserve-3d;
    will-change: transform;
  }
  .h-x {
    transform: rotateX(80deg);
    animation: spinX 9s linear infinite;
  }
  .h-y {
    transform: rotateY(80deg);
    animation: spinY 12s linear infinite reverse;
  }
  .h-z {
    transform: rotateZ(45deg) rotateX(45deg);
    animation: spinZ 15s linear infinite;
  }
  .h-diag {
    transform: rotate3d(1, 1, 0, 60deg);
    animation: spinDiag 10s linear infinite reverse;
    border-color: rgba(96, 165, 250, 0.45);
  }
  .h-core-sphere {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(96,165,250,0.5) 45%, rgba(30,58,138,0.15) 80%, transparent 100%);
    box-shadow: 0 0 25px rgba(59,130,246,0.55);
    animation: pulseCore 3s ease-in-out infinite alternate;
  }
  @keyframes holoWorldRotate {
    0% { transform: rotateX(15deg) rotateY(0deg) rotateZ(0deg); }
    50% { transform: rotateX(-15deg) rotateY(180deg) rotateZ(10deg); }
    100% { transform: rotateX(15deg) rotateY(360deg) rotateZ(0deg); }
  }
  @keyframes spinX { 0% { transform: rotateX(80deg) rotateZ(0deg); } 100% { transform: rotateX(80deg) rotateZ(360deg); } }
  @keyframes spinY { 0% { transform: rotateY(80deg) rotateZ(0deg); } 100% { transform: rotateY(80deg) rotateZ(360deg); } }
  @keyframes spinZ { 0% { transform: rotateZ(45deg) rotateX(45deg) rotate(0deg); } 100% { transform: rotateZ(45deg) rotateX(45deg) rotate(360deg); } }
  @keyframes spinDiag { 0% { transform: rotate3d(1, 1, 0, 60deg) rotateZ(0deg); } 100% { transform: rotate3d(1, 1, 0, 60deg) rotateZ(360deg); } }
  @keyframes pulseCore { 0% { transform: scale(0.9); opacity: 0.7; } 100% { transform: scale(1.15); opacity: 1; } }
  
  /* Bold Blue Professional Accents */
  .title-accent-blue {
    color: #ffffff !important;
    font-weight: 800 !important;
    text-shadow: 0 2px 10px rgba(37, 99, 235, 0.45);
  }
  .sub-accent-blue {
    color: #93c5fd !important;
    font-weight: 700 !important;
    letter-spacing: 0.025em;
  }
</style>

</body>
</html>
