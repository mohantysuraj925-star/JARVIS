<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS by Suraj</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #07090f;
      --card:   rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --adim:   rgba(99,102,241,0.15);
      --text:   #dde3ed;
      --muted:  #5e6a7e;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 340px;
      padding: 44px 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 10px;
      margin-bottom: 6px;
    }
    .logo em { color: var(--accent); font-style: normal; }
    .brand { font-size: 11px; font-weight: 500; letter-spacing: 1px; color: var(--muted); }
    .sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 18px 14px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 10px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: rgba(94,106,126,0.5);
      letter-spacing: 6px;
      font-size: 20px;
    }
    .key-input:focus {
      border-color: var(--accent);
      background: var(--adim);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .err {
      font-size: 12px;
      color: #f87171;
      min-height: 18px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
      text-align: left;
    }
    .voice-note code {
      background: rgba(255,255,255,0.07);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
    }
    #reconnecting {
      display: none;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }
  </style>

    <!-- PWA Config -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
        });
      }
    </script>

</head>
<body>
  <div class="card" id="card">
    <div class="logo"><em>J</em>ARVIS <span class="brand">by Suraj</span></div>
    <div class="sub">Remote Access</div>
    <p id="reconnecting">Reconnecting…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the JARVIS desktop app to get a QR code or session key.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">CONNECT</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--text)">Voice commands:</strong> open
      <code>chrome://flags</code> on your phone, search
      <code>Insecure origins treated as secure</code>, add your JARVIS URL, tap Relaunch.
    </p>
  </div>

  <script>
    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      // Device token rejected (server restarted) — clear it and show normal form
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('jarvis_token', data.token);
        if (data.device_token) localStorage.setItem('jarvis_device_token', data.device_token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>

<script id="mobile-coming-soon-enforcer">
(function() {
    async function enforceMobileState() {
        try {
            const res = await fetch('/api/admin/mobile_status?t=' + Date.now(), { cache: 'no-store' });
            const data = await res.json();
            const isActive = (data.active === true || data.enabled === true || data.status === 'active');

            // Find all Android / Mobile / APK links and buttons
            const candidates = document.querySelectorAll('a, button');
            candidates.forEach(el => {
                const href = (el.getAttribute('href') || '').toLowerCase();
                const text = (el.innerText || el.textContent || '').toLowerCase();
                const id = (el.id || '').toLowerCase();
                const cl = (el.className || '').toLowerCase();

                // Target strictly Android / APK / Mobile downloads
                const isMobileBtn = href.includes('.apk') || 
                                    text.includes('android') || 
                                    text.includes('mobile download') || 
                                    text.includes('download apk') || 
                                    id.includes('mobile') || 
                                    id.includes('android') || 
                                    cl.includes('mobile-download');

                // Leave Windows / PC strictly untouched
                const isWindows = href.includes('.exe') || href.includes('.zip') || text.includes('windows') || text.includes('pc');
                if (isWindows) return;

                if (isMobileBtn) {
                    if (!isActive) {
                        if (!el.dataset.originalContent) {
                            el.dataset.originalContent = el.innerHTML;
                            el.dataset.originalHref = el.getAttribute('href') || '#';
                        }
                        el.innerHTML = '<span class="inline-flex items-center gap-1.5 font-bold">🔥 Coming Soon</span>';
                        el.removeAttribute('href');
                        el.style.pointerEvents = 'none';
                        el.style.opacity = '0.75';
                        el.style.cursor = 'not-allowed';
                    } else {
                        if (el.dataset.originalContent) {
                            el.innerHTML = el.dataset.originalContent;
                            el.setAttribute('href', el.dataset.originalHref);
                        }
                        el.style.pointerEvents = 'auto';
                        el.style.opacity = '1';
                        el.style.cursor = 'pointer';
                    }
                }
            });
        } catch(err) {
            console.error("Master mobile enforcement error:", err);
        }
    }

    window.addEventListener("DOMContentLoaded", enforceMobileState);
    setInterval(enforceMobileState, 2000);
})();
</script>


<canvas id="holoCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.65;"></canvas>
<script id="holo-engine">
(function() {
    function initHolo() {
        const cvs = document.getElementById('holoCanvas');
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        let w = cvs.width = window.innerWidth;
        let h = cvs.height = window.innerHeight;

        window.addEventListener('resize', () => {
            w = cvs.width = window.innerWidth;
            h = cvs.height = window.innerHeight;
        });

        // 3D Holographic Particle Sphere Nodes
        const numPts = window.innerWidth < 768 ? 70 : 130;
        const pts = [];
        const radius = Math.min(w, h) * 0.32;

        for (let i = 0; i < numPts; i++) {
            const theta = Math.acos(2 * Math.random() - 1);
            const phi = 2 * Math.PI * Math.random();
            pts.push({
                x: radius * Math.sin(theta) * Math.cos(phi),
                y: radius * Math.sin(theta) * Math.sin(phi),
                z: radius * Math.cos(theta)
            });
        }

        let angleX = 0.002;
        let angleY = 0.004;

        function render() {
            ctx.clearRect(0, 0, w, h);
            const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

            const proj = [];
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                // Rotate Y
                let x1 = p.x * cosY + p.z * sinY;
                let z1 = -p.x * sinY + p.z * cosY;
                // Rotate X
                let y1 = p.y * cosX - z1 * sinX;
                let z2 = p.y * sinX + z1 * cosX;

                p.x = x1; p.y = y1; p.z = z2;

                const fov = 400;
                const scale = fov / (fov + z2 + 300);
                const x2d = x1 * scale + w / 2;
                const y2d = y1 * scale + h / 2;

                proj.push({ x: x2d, y: y2d, scale: scale, alpha: (z2 + radius) / (2 * radius) });
            }

            // Draw holographic rings & lines
            ctx.strokeStyle = "rgba(161, 161, 170, 0.12)";
            ctx.lineWidth = 1;
            for (let i = 0; i < proj.length; i += 4) {
                if (proj[i+1]) {
                    ctx.beginPath();
                    ctx.moveTo(proj[i].x, proj[i].y);
                    ctx.lineTo(proj[i+1].x, proj[i+1].y);
                    ctx.stroke();
                }
            }

            // Draw glowing points (sleek platinum theme)
            for (let i = 0; i < proj.length; i++) {
                const p = proj[i];
                ctx.fillStyle = `rgba(244, 244, 245, ${Math.max(0.15, p.alpha * 0.7)})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(1, p.scale * 2.2), 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    }

    // Lazy load after paint: PageSpeed will score 100 without main-thread blocking
    if ('requestIdleCallback' in window) {
        requestIdleCallback(() => setTimeout(initHolo, 300));
    } else {
        window.addEventListener('load', () => setTimeout(initHolo, 300));
    }
})();
</script>

</body>
</html>
