<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GARUDA BY SURAJ — Mobile Cockpit</title>
  <script src="/static/crypto.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(239, 68, 68, 0.25);
      --border-glow: rgba(239, 68, 68, 0.45);
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.2);
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --gdim: rgba(16, 185, 129, 0.15);
    }
    body {
      height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e111a 0%, var(--bg) 75%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Top Header Bar */
    header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }
    .brand-title span {
      color: #94a3b8;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: var(--gdim);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* Main Console / Logs */
    main {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .console-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }
    .console-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #logOutput {
      flex: 1;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #e2e8f0;
      word-break: break-word;
    }
    .log-line {
      margin-bottom: 4px;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .log-sys { color: #f87171; }
    .log-user { color: #38bdf8; }

    /* Quick Action Grid */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn-action {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-action:active {
      transform: scale(0.95);
      background: var(--accent-glow);
      border-color: var(--accent);
    }
    .btn-action i {
      width: 18px;
      height: 18px;
      color: var(--accent);
    }

    /* Bottom Control Bar */
    footer {
      padding: 12px 14px;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-box {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: white;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: var(--accent);
    }
    .btn-send {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-send:active {
      transform: scale(0.92);
    }
    .btn-send i {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-title">
      <i data-lucide="zap"></i>
      GARUDA <span>BY SURAJ</span>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      ACTIVE
    </div>
  </header>

  <!-- Main Viewport -->
  <main>
    <!-- Quick Controls -->
    <div class="panel-card">
      <div class="action-grid">
        <button class="btn-action" onclick="sendCommand('mute')">
          <i data-lucide="mic-off"></i>
          <span>Mute</span>
        </button>
        <button class="btn-action" onclick="sendCommand('unmute')">
          <i data-lucide="mic"></i>
          <span>Unmute</span>
        </button>
        <button class="btn-action" onclick="sendCommand('screenshot')">
          <i data-lucide="camera"></i>
          <span>Vision</span>
        </button>
        <button class="btn-action" onclick="sendCommand('interrupt')">
          <i data-lucide="octagon-alert"></i>
          <span>Halt</span>
        </button>
      </div>
    </div>

    <!-- Live Logs -->
    <div class="panel-card console-box">
      <div class="console-header">
        <span>TELEMETRY STREAM</span>
        <i data-lucide="terminal" style="width: 14px; height: 14px;"></i>
      </div>
      <div id="logOutput">
        <div class="log-line log-sys">[SYS] Connected to GARUDA Host Core.</div>
        <div class="log-line log-sys">[SYS] Neural link established via WebSocket.</div>
      </div>
    </div>
  </main>

  <!-- Input Footer -->
  <footer>
    <input type="text" id="cmdInput" class="input-box" placeholder="Send command or query..." onkeydown="handleEnter(event)">
    <button class="btn-send" onclick="sendInput()">
      <i data-lucide="send"></i>
    </button>
  </footer>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    let ws = null;
    const logBox = document.getElementById('logOutput');

    function appendLog(txt, isUser=false) {
      const line = document.createElement('div');
      line.className = 'log-line ' + (isUser ? 'log-user' : 'log-sys');
      line.textContent = txt;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function initWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${location.host}/ws`;
      try {
        ws = new WebSocket(wsUrl);
        ws.onopen = () => appendLog('[SYS] Linked to Engine.');
        ws.onmessage = (e) => appendLog(e.data);
        ws.onclose = () => {
          appendLog('[SYS] Disconnected. Reconnecting in 3s...');
          setTimeout(initWS, 3000);
        };
      } catch(err) {
        appendLog('[ERR] Connection error: ' + err);
      }
    }

    function sendCommand(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'command', command: cmd }));
        appendLog('> ' + cmd, true);
      }
    }

    function sendInput() {
      const inp = document.getElementById('cmdInput');
      const text = inp.value.trim();
      if (!text) return;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'text', text: text }));
        appendLog('> ' + text, true);
        inp.value = '';
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendInput();
    }

    window.onload = initWS;
  </script>
</body>
</html>
